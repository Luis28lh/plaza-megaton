<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mis Solicitudes — Plaza Megatón</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo-wrap">
        <img src="assets/logo-megaton.svg" alt="Plaza Megatón Logo" class="brand-logo-img">
      </a>
      <div id="user-header-pill" class="user-status-pill">
        🔑 Acceder
      </div>
    </div>
  </header>

  <main class="main-wrapper">

    <!-- Encabezado de la página -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div>
        <h1 style="font-size:20px; font-weight:800; color:var(--text-main);">📋 Mis Solicitudes</h1>
        <p style="font-size:13px; color:var(--text-muted);">Historial y seguimiento de reclamaciones <span style="background:#F1F5F9; color:#475569; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:4px;">Solo Lectura</span></p>
      </div>
      <a href="index.html" class="btn-sm btn-sm-outline" style="text-decoration:none; padding:6px 14px; font-size:13px; font-weight:700;">
        🏠 Inicio
      </a>
    </div>

    <!-- Si no está autenticado -->
    <div id="auth-prompt-box" class="card-box" style="display: none; text-align: center; padding: 32px 16px;">
      <div style="font-size: 38px; margin-bottom: 8px;">🔐</div>
      <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Identificación requerida</h3>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
        Para consultar tus solicitudes debes ingresar con tu correo registrado.
      </p>
      <a href="login.html" class="btn-primary" style="display: inline-flex; width: auto; padding: 12px 28px;">
        🔑 Acceder sin contraseña
      </a>
    </div>

    <!-- Contenedor dinámico de solicitudes -->
    <div id="solicitudes-list-container"></div>

  </main>

  <!-- Modal de Detalle de Solicitud -->
  <div id="solicitud-detail-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--text-main);">Detalle de Solicitud</h3>
        <button onclick="closeSolicitudModal()" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="solicitud-detail-body" class="modal-body"></div>
      <div class="modal-footer">
        <button onclick="closeSolicitudModal()" class="btn-secondary" style="width: auto; min-height: 40px; padding: 0 18px;">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Barra de Navegación Inferior Móvil Simplificada -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="novedades.html?tab=novedades" class="nav-item">
      <span class="nav-item-icon">📢</span>
      <span>Novedades</span>
    </a>
    <a href="novedades.html?tab=mensajes" class="nav-item">
      <span class="nav-item-icon">📬</span>
      <span>Mis Mensajes</span>
    </a>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/mis-solicitudes.js"></script>
</body>
</html>
