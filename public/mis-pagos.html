<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mis Pagos — Plaza Megatón</title>
  <link rel="stylesheet" href="css/styles.css?v=3.3">
  <link rel="stylesheet" href="css/admin.css?v=3.3">
</head>
<body>

  <!-- Encabezado -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo-wrap">
        <img src="assets/logo-megaton.svg" alt="Plaza Megatón Logo" class="brand-logo-img">
      </a>
      <div id="user-header-pill" class="user-status-pill">
        🔑 Acceder
      </div>
    </div>
  </header>

  <main class="main-wrapper">

    <!-- Encabezado de la página -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div>
        <h1 style="font-size:20px; font-weight:800; color:var(--text-main);">💰 Mis Pagos</h1>
        <p style="font-size:13px; color:var(--text-muted);">Historial de cuotas y comprobantes bancarios <span style="background:#F1F5F9; color:#475569; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:4px;">Solo Lectura</span></p>
      </div>
      <a href="index.html" class="btn-sm btn-sm-outline" style="text-decoration:none; padding:6px 14px; font-size:13px; font-weight:700;">
        🏠 Inicio
      </a>
    </div>

    <!-- Si no está autenticado -->
    <div id="auth-prompt-box" class="card-box" style="display: none; text-align: center; padding: 32px 16px;">
      <div style="font-size: 38px; margin-bottom: 8px;">🔐</div>
      <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Identificación requerida</h3>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
        Para consultar tus pagos y estados de cuenta debes ingresar con tu correo registrado.
      </p>
      <a href="login.html" class="btn-primary" style="display: inline-flex; width: auto; padding: 12px 28px;">
        🔑 Acceder sin contraseña
      </a>
    </div>

    <!-- Contenedor dinámico de pagos -->
    <div id="pagos-list-container"></div>

  </main>

  <!-- Modal de Visor de Voucher -->
  <div id="voucher-modal" class="modal-backdrop" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:16px; max-width:550px; width:100%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);">
      <div style="padding:14px 18px; border-bottom:1px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center;">
        <h3 id="voucher-modal-title" style="font-size:15px; font-weight:800; color:#0F172A; margin:0;">📄 Comprobante de Pago</h3>
        <button onclick="closeVoucherModal()" style="background:none; border:none; font-size:22px; cursor:pointer; color:#64748B;">✕</button>
      </div>
      <div id="voucher-modal-body" style="padding:16px; overflow-y:auto; text-align:center; background:#F8FAFC;"></div>
      <div style="padding:12px 18px; border-top:1px solid #E2E8F0; text-align:right; background:#FFFFFF;">
        <button onclick="closeVoucherModal()" class="btn-primary" style="min-height:38px; padding:0 20px; font-size:13px;">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Barra de Navegación Inferior Móvil Simplificada -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="novedades.html?tab=novedades" class="nav-item">
      <span class="nav-item-icon">📢</span>
      <span>Novedades</span>
    </a>
    <a href="novedades.html?tab=mensajes" class="nav-item">
      <span class="nav-item-icon">📬</span>
      <span>Mis Mensajes</span>
    </a>
  </nav>

  <script src="js/app.js?v=3.3"></script>
  <script src="js/mis-pagos.js?v=3.3"></script>
</body>
</html>
