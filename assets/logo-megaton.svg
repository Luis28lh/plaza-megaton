<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Isotipo Megatón: Letra M estilizada arquitectónica -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="70" height="70" rx="14" fill="url(#redGrad)" filter="url(#shadow)"/>
    <!-- M dinámica -->
    <path d="M18 52 V22 L35 38 L52 22 V52" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pequeño punto acento arquitectónico -->
    <circle cx="35" cy="50" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Logotipo Texto -->
  <g transform="translate(95, 20)">
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#0F172A">
      PLAZA <tspan fill="#D32F2F">MEGATÓN</tspan>
    </text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#64748B">
      SISTEMA DE GESTIÓN INMOBILIARIA
    </text>
  </g>
</svg>
